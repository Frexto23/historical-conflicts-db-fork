services:
  pg_course:
    image: postgres:16
    container_name: pg_course
    environment:
      POSTGRES_DB: course_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
    ports:
      - "7432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - pg-net
    restart: unless-stopped

  postgres-replica3:
    image: postgres:16
    container_name: postgres-replica3
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
      POSTGRES_DB: course_db
    ports:
      - "7433:5432"
    volumes:
      - replica3_data:/var/lib/postgresql/data
    networks:
      - pg-net
    restart: unless-stopped
    depends_on:
      - pg_course
  
  postgres-replica2:
    image: postgres:16
    container_name: postgres-replica2
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
      POSTGRES_DB: course_db
    ports:
      - "7434:5432"
    volumes:
      - replica2_data:/var/lib/postgresql/data
    networks:
      - pg-net
    restart: unless-stopped
    depends_on:
      - pg_course

volumes:
  pg_data:
  replica3_data:
  replica2_data:

networks:
  pg-net:
    driver: bridge